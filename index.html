<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Brush Studio</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181a20;
    --border: #2a2d36;
    --fg: #e2e8f0;
    --mut: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --ok: #10b981;
    --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
  .toolbar { display: flex; gap: 12px; }
  button {
    background: var(--border); color: var(--fg); border: none; padding: 6px 12px;
    border-radius: 6px; cursor: pointer; font-weight: 500; transition: 0.2s;
  }
  button:hover { background: #3a3f4c; }
  button.primary { background: var(--accent); color: white; }
  button.primary:hover { background: var(--accent-hover); }
  
  main {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px;
    flex: 1; min-height: 0;
  }
  .pane { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; display: flex; flex-direction: column; overflow: hidden;
  }
  .card-header {
    padding: 8px 12px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--mut); display: flex; justify-content: space-between; align-items: center;
  }
  
  textarea {
    flex: 1; width: 100%; min-height: 200px; background: transparent; color: var(--fg);
    border: none; outline: none; font: 13px/1.6 ui-monospace, Menlo, monospace;
    padding: 16px; resize: none; white-space: pre;
  }

  /* Storyboard Grid */
  #storyboard {
    flex: 1; overflow-y: auto; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px; padding-bottom: 20px; align-content: start;
  }
  .scene-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.2); transition: transform 0.2s;
  }
  .scene-card:hover { transform: translateY(-2px); border-color: #4a5568; }
  .scene-header {
    padding: 10px 14px; font-weight: 600; font-size: 13px;
    background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .scene-badge { font-size: 10px; background: var(--border); padding: 2px 6px; border-radius: 4px; color: var(--mut); }
  .canvas-container {
    width: 100%; aspect-ratio: 1/1; background: #000; position: relative;
    display: flex; justify-content: center; align-items: center;
  }
  canvas {
    width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated;
  }
  .scene-footer { padding: 8px 12px; font-size: 11px; color: var(--mut); display: flex; justify-content: space-between; border-top: 1px solid var(--border); }
  
  /* Status Colors */
  .status-ok { color: var(--ok); }
  .status-err { color: var(--bad); }
  
  /* Empty State */
  .empty-state {
    grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--mut);
  }
</style>
</head>
<body>

<header>
  <h1>Pixel Brush Studio</h1>
  <div class="toolbar">
    <button id="btnStoryboard" class="primary">▶ Generate Storyboard</button>
  </div>
</header>

<main>
  <!-- Left Pane: Editor -->
  <div class="pane">
    <div class="card" style="flex:1;">
      <div class="card-header">
        <span>Source Code</span>
        <span>Multi-scene supported (Separate with blank lines)</span>
      </div>
      <textarea id="src" spellcheck="false"></textarea>
    </div>
  </div>

  <!-- Right Pane: Storyboard Output -->
  <div class="pane">
    <div id="storyboard">
      <!-- Cards will be injected here -->
    </div>
  </div>
</main>

<!-- The Pixel Brush Engine (Unmodified logic, isolated) -->
<script>
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5],RET={};
let W=128,H=128;
let img=new Float32Array(W*H*3),P,V,DEF,ERR,NC,SEED,rs,D=false,T=.5,DEPTH,DL,CACHE=new Map(),FN={},SPR={};

function setSize(w,h){
  w=Math.round(w);h=Math.round(h);
  if(!(w>=8&&w<=2048))w=128;if(!(h>=8&&h<=2048))h=128;
  W=w;H=h;img=new Float32Array(W*H*3);
}
function rng(){rs=rs+0x6D2B79F5|0;let t=Math.imul(rs^rs>>>15,1|rs);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function hash(a,b){let n=(Math.imul(a,374761393)+Math.imul(b,668265263)+Math.imul(SEED,1597334677))|0;n=Math.imul(n^n>>>13,1274126177);return((n^n>>>16)&65535)/65535}
function noise(x,y){const ix=Math.floor(x),iy=Math.floor(y);let fx=x-ix,fy=y-iy;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);const a=hash(ix,iy),b=hash(ix+1,iy),c=hash(ix,iy+1),d=hash(ix+1,iy+1);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy}
function fbm(x,y,o=4){let v=0,t=0,a=.5,f=1;for(let i=0;i<o;i++){v+=a*noise(x*f+i*17.3,y*f+i*9.1);t+=a;a*=.5;f*=2}return v/t}
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const lc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const F={sin:Math.sin,cos:Math.cos,tan:Math.tan,abs:Math.abs,min:Math.min,max:Math.max,floor:Math.floor,ceil:Math.ceil,round:Math.round,sqrt:Math.sqrt,pow:Math.pow,clamp:cl,noise,fbm,
smooth:(a,b,v)=>{const t=cl((v-a)/(b-a),0,1);return t*t*(3-2*t)},
dist:(a,b,c,d)=>Math.hypot(a-c,b-d),
rand:(a,b)=>a===undefined?rng():a+(b-a)*rng(),
mix:(a,b,t)=>{t=cl(t,0,1);return Array.isArray(a)?(D?(t>T?b:a):lc(a,b,t)):a+(b-a)*t},
ramp:(t,...c)=>{t=cl(t,0,1);const n=c.length-1,p=t*n,i=Math.min(Math.floor(p),n-1),f=p-i;return D?(f>T?c[i+1]:c[i]):lc(c[i],c[i+1],f)},
shade:(c,n)=>{n=cl(n,-1,1);return n>0?lc(c,[255,255,255],n*.6):lc(c,[0,0,0],-n*.7)},
circ:(px,py,cx,cy,r)=>Math.hypot(px-cx,py-cy)-r,
cap:(px,py,x1,y1,x2,y2,r1,r2=r1)=>{const dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy||1,t=cl(((px-x1)*dx+(py-y1)*dy)/L,0,1);return Math.hypot(px-x1-dx*t,py-y1-dy*t)-(r1+(r2-r1)*t)},
ell:(px,py,cx,cy,rx,ry)=>(Math.hypot((px-cx)/rx,(py-cy)/ry)-1)*Math.min(rx,ry),
box:(px,py,cx,cy,hw,hh)=>{const qx=Math.abs(px-cx)-hw,qy=Math.abs(py-cy)-hh;return Math.hypot(Math.max(qx,0),Math.max(qy,0))+Math.min(Math.max(qx,qy),0)},
smin:(a,b,k)=>{const h=Math.max(k-Math.abs(a-b),0)/k;return Math.min(a,b)-h*h*k*.25}};
const hx=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16));
const TR=/\s*(#[0-9a-fA-F]{6}\b|(?:\d+\.?\d*|\.\d+)|[A-Za-z_]\w*|<=|>=|==|!=|[-+*\/%^<>(),])/y;
const CMP={'<':(a,b)=>a<b,'>':(a,b)=>a>b,'<=':(a,b)=>a<=b,'>=':(a,b)=>a>=b,'==':(a,b)=>a==b,'!=':(a,b)=>a!=b};
function compile(src){let c=CACHE.get(src);if(c)return c;const t=[];let i=0,m;
while(i<src.length){TR.lastIndex=i;m=TR.exec(src);if(!m){if(/^\s*$/.test(src.slice(i)))break;throw Error('bad token near "'+src.slice(i,i+8)+'"')}t.push(m[1]);i=TR.lastIndex}
let p=0;const pk=()=>t[p],nx=()=>t[p++];
const or=()=>{let a=an();while(pk()==='or'){nx();const l=a,r=an();a=()=>l()||r()}return a};
const an=()=>{let a=nt();while(pk()==='and'){nx();const l=a,r=nt();a=()=>l()&&r()}return a};
const nt=()=>{if(pk()==='not'){nx();const e=nt();return()=>!e()}return cm()};
const cm=()=>{let a=ad();while(CMP[pk()]){const f=CMP[nx()],l=a,r=ad();a=()=>f(l(),r())}return a};
const ad=()=>{let a=mu();while(pk()==='+'||pk()==='-'){const o=nx(),l=a,r=mu();a=o==='+'?()=>l()+r():()=>l()-r()}return a};
const mu=()=>{let a=un();while(pk()==='*'||pk()==='/'||pk()==='%'){const o=nx(),l=a,r=un();a=o==='*'?()=>l()*r():o==='/'?()=>l()/r():()=>l()%r()}return a};
const un=()=>{if(pk()==='-'){nx();const e=un();return()=>-e()}return pw()};
const pw=()=>{const l=pr();if(pk()==='^'){nx();const r=un();return()=>Math.pow(l(),r())}return l};
const pr=()=>{const k=nx();if(k===undefined)throw Error('unexpected end');
if(k==='('){const e=or();if(nx()!==')')throw Error('missing )');return e}
if(k[0]==='#'){const v=hx(k);return()=>v}
if(/^[\d.]/.test(k)){const v=parseFloat(k);return()=>v}
if(/^[A-Za-z_]/.test(k)){if(pk()==='('){nx();const a=[];if(pk()!==')'){do{a.push(or())}while(pk()===','&&nx())}if(nx()!==')')throw Error('missing ) in '+k+'()');
const f=F[k];if(f)return()=>f(...a.map(g=>g()));return()=>{const u=FN[k];if(!u)throw Error('unknown function '+k);const ar=a.map(g=>g()),old=V;V=Object.assign({},old);u[0].forEach((p,i)=>V[p]=ar[i]);try{return u[1]()}finally{V=old}}}
return()=>{let v=V[k];if(v===undefined)v=P[k];if(v===undefined)throw Error('unknown name "'+k+'"');return v}}
throw Error('unexpected "'+k+'"')};
const e=or();if(p<t.length)throw Error('unexpected "'+t[p]+'"');CACHE.set(src,e);return e}
const ev=s=>compile(s)();
function col(s){D=false;V.x=V.y=0;const c=ev(s);if(!Array.isArray(c))throw Error('color expected: '+s);return c}
function sp(s,sep){const r=[];let d=0,b='';const cm=sep===',';for(const ch of s){if(ch==='(')d++;else if(ch===')')d--;if(d===0&&(cm?ch===',':/\s/.test(ch))){if(b!==''||cm)r.push(b);b=''}else b+=ch}if(b!==''||cm)r.push(b);return r}
function put(x,y,c,a=1,b='replace'){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=W||y>=H)return;const i=(y*W+x)*3;
for(let k=0;k<3;k++){const p=img[i+k],q=c[k];let n;if(b==='add')n=p+q*a;else if(b==='mul')n=p+(p*q/255-p)*a;else if(b==='screen')n=p+(255-(255-p)*(255-q)/255-p)*a;else n=p+(q-p)*a;img[i+k]=n<0?0:n>255?255:n}}
let SO={a:1,d:false,b:'replace'};
function opts(a){SO={a:1,d:false,b:'replace'};return a.filter((s,i)=>{if(i===0)return true;if(/^dither$/i.test(s)){SO.d=true;return false}const m=s.match(/^(a|blend)=(.+)$/i);if(m){if(m[1].toLowerCase()==='a')SO.a=ev(m[2]);else SO.b=m[2];return false}return true})}
function flat(a){return a.flatMap(s=>{const q=sp(s,',');return q.length>1&&!/^[A-Za-z_]\w*=/.test(s)?q:[s]})}
function sput(x,y,c){let a=SO.a;if(SO.d){const xi=Math.round(x),yi=Math.round(y);if(a<=(BAY[(((yi%4)+4)%4)*4+(((xi%4)+4)%4)]+.5)/16)return;a=1}put(x,y,c,a,SO.b)}
function disc(cx,cy,r,c){const R=Math.ceil(r);for(let oy=-R;oy<=R;oy++)for(let ox=-R;ox<=R;ox++)if(Math.hypot(ox,oy)<=r+1e-6)sput(cx+ox,cy+oy,c)}
function paint(t){const m=t.match(/^paint(?:\s+in\s+(\S+)\s+(\S+)\s+(\S+)\s+(\S+))?(?:\s+where\s+(.+?))?\s+with\s+(.+)$/i);if(!m)throw Error('bad paint syntax');
let rest=m[6],bl='replace',ae=null,dt=false,o;
while((o=rest.match(/\s+(blend=\S+|a=\S+|dither)\s*$/))){rest=rest.slice(0,o.index);const s=o[1];if(s==='dither')dt=true;else if(s[0]==='b')bl=s.slice(6);else ae=s.slice(2)}
let x0=0,y0=0,bw=W,bh=H;if(m[1])[x0,y0,bw,bh]=[1,2,3,4].map(k=>Math.round(ev(m[k])));
const cd=m[5]?compile(m[5]):null,cc=compile(rest),ca=ae?compile(ae):null;D=dt;
try{for(let y=Math.max(0,y0);y<Math.min(H,y0+bh);y++){if(performance.now()>DL)throw Error('time limit hit');
for(let x=Math.max(0,x0);x<Math.min(W,x0+bw);x++){V.x=x;V.y=y;T=(BAY[(y&3)*4+(x&3)]+.5)/16;if(cd&&!cd())continue;
let a=ca?ca():1;if(!(a>0))continue;if(dt&&ca){if(a<=T)continue;a=1}else if(a>1)a=1;
const c=cc();if(!Array.isArray(c))throw Error('color expected');put(x,y,c,a,bl)}}}finally{D=false}}
function line(t){const a=flat(opts(sp(t)));const[x1,y1,x2,y2]=[1,2,3,4].map(i=>ev(a[i]));const c=col(a[5]);let w=1,w2=null;
for(const o of a.slice(6)){if(/^w2=/i.test(o))w2=ev(o.slice(3));else if(/^w=/i.test(o))w=ev(o.slice(2))}if(w2===null)w2=w;
const n=Math.max(Math.abs(x2-x1),Math.abs(y2-y1),1);for(let k=0;k<=n;k++){const f=k/n;disc(Math.round(x1+(x2-x1)*f),Math.round(y1+(y2-y1)*f),Math.max(0,(w+(w2-w)*f)/2-.01),c)}}
function poly(t){const a=opts(sp(t)).slice(1),c=col(a.pop()),pts=a.map(s=>sp(s,',').map(ev));
const ys=pts.map(p=>p[1]),xs=pts.map(p=>p[0]);
for(let y=Math.floor(Math.min(...ys));y<=Math.max(...ys);y++)for(let x=Math.floor(Math.min(...xs));x<=Math.max(...xs);x++){let ins=false;
for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)ins=!ins}if(ins)sput(x,y,c)}}
function drawRows(R,x0,y0,opt){let s=1,fl=false,ol=null;const mp={};
for(const o of opt){if(/^flip$/i.test(o)){fl=true;continue}const q=o.indexOf('=');if(q<0)continue;const n=o.slice(0,q),v=o.slice(q+1);
if(n==='scale')s=Math.max(1,Math.round(ev(v)));else if(n==='outline')ol=col(v);else if(n.length===1)mp[n]=col(v)}
const w=Math.max(...R.map(r=>r.length)),cells=[],occ=new Set();
R.forEach((r,dy)=>[...r].forEach((c,dx)=>{if(mp[c]){const X=fl?w-1-dx:dx;cells.push([X,dy,mp[c]]);occ.add(X+','+dy)}}));
const blk=(cx,cy,c)=>{for(let j=0;j<s;j++)for(let i=0;i<s;i++)put(x0+cx*s+i,y0+cy*s+j,c)};
if(ol){const ed=new Set();for(const[cx,cy]of cells)for(const[ox,oy]of[[1,0],[-1,0],[0,1],[0,-1]]){const k=(cx+ox)+','+(cy+oy);if(!occ.has(k)&&!ed.has(k)){ed.add(k);blk(cx+ox,cy+oy,ol)}}}
for(const[cx,cy,c]of cells)blk(cx,cy,c)}
function parse(L,i,top){const N=[];while(i<L.length){const[ln,raw]=L[i],t=raw.trim();if(!t){i++;continue}const k=t.split(/\s/)[0].toLowerCase();
if(k==='end'){if(top){i++;continue}return[N,i+1]}
if(k==='palette'){i++;while(i<L.length&&/^\s/.test(L[i][1])&&L[i][1].trim()){const tk=L[i][1].trim().split(/\s+/);
for(let j=0;j+1<tk.length;j+=2){if(/^#[0-9a-fA-F]{6}$/.test(tk[j+1]))P[tk[j]]=hx(tk[j+1]);else ERR.push('ERR line '+L[i][0]+': bad palette entry '+tk[j])}i++}continue}
if(k==='for'||k==='if'||k==='def'){const r=parse(L,i+1,false);N.push([ln,t,r[0]]);i=r[1];continue}
if(k==='rows'||k==='sprite'){const b=[];i++;while(i<L.length&&L[i][1].trim().toLowerCase()!=='end'){b.push(L[i][1].trim());i++}i++;N.push([ln,t,b]);continue}
N.push([ln,t,null]);i++}return[N,i]}
function exec(N){for(const[ln,t,ch]of N){try{cmd(t,ch);NC++}catch(e){if(e===RET)throw e;const m='ERR line '+ln+': '+e.message;if(ERR.length<40&&!ERR.includes(m))ERR.push(m)}}}
function cmd(t,ch){const k=t.split(/\s/)[0].toLowerCase();
if(k==='size'){const a=sp(t);if(a.length>=3)setSize(ev(a[1]),ev(a[2]));return}
if(k==='clip')return;
if(k==='seed'){SEED=Math.floor(ev(t.slice(4)));rs=SEED}
else if(k==='let'){const m=t.match(/^let\s+(\w+)\s*=\s*(.+)$/i);if(!m)throw Error('bad let');V[m[1]]=ev(m[2])}
else if(k==='for'){const m=t.match(/^for\s+(\w+)\s+in\s+(\S+?)\.\.(\S+)(?:\s+step\s+(\S+))?$/i);if(!m)throw Error('bad for');
const a=ev(m[2]),b=ev(m[3]),st=m[4]?ev(m[4]):1;if(!(st>0))throw Error('step must be > 0');
for(let i=a,n=0;i<=b&&n<1e5;i+=st,n++){if(performance.now()>DL)throw Error('time limit hit');V[m[1]]=i;exec(ch)}}
else if(k==='if'){if(ev(t.slice(2)))exec(ch)}
else if(k==='def'){const a=t.split(/\s+/);DEF[a[1].toLowerCase()]=[a.slice(2),ch]}
else if(k==='return')throw RET;
else if(k==='paint')paint(t);
else if(k==='plot'){const a=flat(opts(sp(t))),c=col(a[3]);let r=0;for(const o of a.slice(4))if(/^r=/i.test(o))r=ev(o.slice(2));disc(Math.round(ev(a[1])),Math.round(ev(a[2])),r,c)}
else if(k==='line')line(t);
else if(k==='poly')poly(t);
else if(k==='rows'){const a=sp(t);drawRows(ch,ev(a[1]),ev(a[2]),a.slice(3))}
else if(k==='sprite'){SPR[t.split(/\s+/)[1]]=ch}
else if(k==='stamp'){const a=sp(t),r=SPR[a[1]];if(!r)throw Error('unknown sprite "'+a[1]+'"');drawRows(r,ev(a[2]),ev(a[3]),a.slice(4))}
else if(k==='fn'){const m=t.match(/^fn\s+(\w+)\s*\(([^)]*)\)\s*=\s*(.+)$/i);if(!m)throw Error('bad fn');FN[m[1]]=[m[2].split(',').map(s=>s.trim()).filter(Boolean),compile(m[3])]}
else if(DEF[k]){const[ps,body]=DEF[k];if(DEPTH>=16)throw Error('recursion depth limit');const args=sp(t.slice(k.length).trim()).map(ev);
const old=V;V=Object.assign({},old);ps.forEach((p,i)=>V[p]=args[i]);DEPTH++;try{exec(body)}catch(e){if(e!==RET)throw e}finally{DEPTH--;V=old}}
else throw Error('unknown command "'+k+'"')}

function run(srcText){
  if(!/^\s*SIZE\s+\S+\s+\S+\s*$/im.test(srcText))setSize(128,128);
  img.fill(0);P={};V={pi:Math.PI,W,H};DEF={};FN={};SPR={};ERR=[];NC=0;SEED=1;rs=1;DEPTH=0;
  DL=performance.now()+Math.min(15000,Math.max(2500,2500*W*H/16384));
  const L=srcText.split('\n').map((l,i)=>[i+1,/^\s*```/.test(l)?'':l.replace(/(^|\s)#(?![0-9a-fA-F]{6}\b).*$/,'').replace(/\s+$/,'')]);
  try{exec(parse(L,0,true)[0])}catch(e){if(e!==RET)ERR.push('ERR '+e.message)}
  return { img, W, H, ERR, NC };
}
</script>

<!-- UI Logic -->
<script>
const src = document.getElementById('src');
const board = document.getElementById('storyboard');
const btn = document.getElementById('btnStoryboard');

const demoText = `# ═══ SCENE 1: The Long Approach ═══
# A lone keeper walks the jetty toward the lighthouse at last light.
seed 11
SIZE 256 256
PALETTE
 sky0 #1A2238  sky1 #4A3B52  sky2 #8A5A52  sky3 #C97B4A

src.value = demoText;

function generateStoryboard() {
  const text = src.value;
  // Split by blank lines (2 or more newlines)
  const scenes = text.split(/\n\s*\n/).filter(s => s.trim().length > 0 && s.includes('SIZE'));
  
  board.innerHTML = '';
  
  if (scenes.length === 0) {
    board.innerHTML = '<div class="empty-state">No scenes found. Make sure your code contains "SIZE" and is separated by blank lines.</div>';
    return;
  }

  scenes.forEach((sceneCode, index) => {
    // Attempt to find a title comment
    let title = `Scene ${index + 1}`;
    const titleMatch = sceneCode.match(/#\s*(?:═══)?\s*(.+?)\s*(?:═══)?$/m);
    if (titleMatch && titleMatch[1]) {
      title = titleMatch[1].trim();
    }

    const card = document.createElement('div');
    card.className = 'scene-card';
    
    const header = document.createElement('div');
    header.className = 'scene-header';
    header.innerHTML = `<span>${title}</span><span class="scene-badge">#${index + 1}</span>`;
    
    const canvasContainer = document.createElement('div');
    canvasContainer.className = 'canvas-container';
    
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 256; // default, will be updated
    
    const footer = document.createElement('div');
    footer.className = 'scene-footer';
    footer.innerHTML = `<span class="status-text">Rendering...</span><span class="meta-text"></span>`;
    
    canvasContainer.appendChild(canvas);
    card.appendChild(header);
    card.appendChild(canvasContainer);
    card.appendChild(footer);
    board.appendChild(card);
    
    // Render the scene
    setTimeout(() => {
      try {
        const result = run(sceneCode);
        
        canvas.width = result.W;
        canvas.height = result.H;
        const ctx = canvas.getContext('2d');
        const id = ctx.createImageData(result.W, result.H);
        
        for (let i = 0; i < result.W * result.H; i++) {
          id.data.set([
            result.img[i*3], 
            result.img[i*3+1], 
            result.img[i*3+2], 
            255
          ], i * 4);
        }
        
        ctx.putImageData(id, 0, 0);
        
        const status = footer.querySelector('.status-text');
        const meta = footer.querySelector('.meta-text');
        
        if (result.ERR.length > 0) {
          status.innerHTML = `<span class="status-err">${result.ERR.length} errors</span>`;
          meta.textContent = result.ERR[0].substring(0, 30) + '...';
        } else {
          status.innerHTML = `<span class="status-ok">Success</span>`;
          meta.textContent = `${result.W}x${result.H}`;
        }
      } catch (e) {
        footer.querySelector('.status-text').innerHTML = `<span class="status-err">Crash</span>`;
        footer.querySelector('.meta-text').textContent = e.message;
      }
    }, 10);
  });
}
