<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stickman Studio</title>
<!-- JSZip for ZIP export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #181a20; --border: #2a2d36;
    --fg: #e2e8f0; --mut: #94a3b8;
    --accent: #3b82f6; --accent-hover: #2563eb;
    --ok: #10b981; --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
  
  .toolbar { display: flex; gap: 12px; align-items: center; }
  
  /* Tabs */
  .tabs { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 8px; border: 1px solid var(--border); }
  .tab { background: transparent; color: var(--mut); border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
  .tab.active { background: var(--border); color: var(--fg); }

  button.action {
    background: var(--border); color: var(--fg); border: none; padding: 6px 12px;
    border-radius: 6px; cursor: pointer; font-weight: 500; transition: 0.2s; display: flex; align-items: center; gap: 6px;
  }
  button.action:hover { background: #3a3f4c; }
  button.primary { background: var(--accent); color: white; }
  button.primary:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  
  main {
    display: grid; grid-template-columns: 400px 1fr; gap: 16px; padding: 16px;
    flex: 1; min-height: 0; overflow: hidden;
  }
  .pane { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden; }
  
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; height: 100%;
  }
  .card-header {
    padding: 8px 12px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--mut); display: flex; justify-content: space-between;
  }
  
  textarea {
    flex: 1; width: 100%; background: transparent; color: var(--fg);
    border: none; outline: none; font: 13px/1.6 ui-monospace, Menlo, monospace;
    padding: 16px; resize: none; white-space: pre; overflow: auto;
  }

  /* View Switching */
  #viewStoryboard, #viewViewer { display: none; width: 100%; height: 100%; overflow-y: auto; }
  #viewStoryboard.active, #viewViewer.active { display: block; }

  /* Storyboard Grid */
  .storyboard-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px; padding-bottom: 20px; align-content: start;
  }
  .scene-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .scene-header {
    padding: 10px 14px; font-weight: 600; font-size: 13px;
    background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .scene-badge { font-size: 10px; background: var(--border); padding: 2px 6px; border-radius: 4px; color: var(--mut); }
  .canvas-container {
    width: 100%; aspect-ratio: 1/1; background: #000;
    display: flex; justify-content: center; align-items: center;
  }
  canvas { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  .scene-footer { padding: 8px 12px; font-size: 11px; color: var(--mut); display: flex; justify-content: space-between; border-top: 1px solid var(--border); }
  
  /* Live Viewer specific */
  .viewer-controls { display: flex; gap: 10px; margin-bottom: 12px; }
  .viewer-canvas-wrapper {
    background: #000; border: 1px solid var(--border); border-radius: 10px;
    display: flex; justify-content: center; align-items: center; width: 100%; height: calc(100% - 50px); overflow: hidden;
  }
  #liveCanvas { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: pixelated; }
  
  .status-ok { color: var(--ok); font-weight: bold; }
  #renderSummary{font-size:11px;color:var(--mut);text-transform:none;letter-spacing:0}
  .render-error-list{display:flex;flex-direction:column;gap:4px;padding:10px 14px;color:#fca5a5;font:12px/1.4 ui-monospace,monospace}
  .render-error-list:empty{display:none}
  .status-err { color: var(--bad); font-weight: bold; }
  .empty-state { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--mut); }

<body>

<header>
  <h1>Stickman</h1>
  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" data-target="viewStoryboard">Storyboard</button>
      <button class="tab" data-target="viewViewer">Live Viewer</button>
    </div>
    <button class="action compact" id="btnSheet" disabled title="Export all rendered scenes as a contact sheet">▦ Sheet</button>
    <button class="action compact" id="btnZip" disabled title="Export all scenes as PNG files">⇩ ZIP</button>
    <button class="action compact" id="btnSourceDownload" title="Download your script">↓ Script</button><button class="action compact" id="btnSourceLoad" title="Open a script file">↑ Open</button><button class="action primary" id="btnRender" title="Render (Ctrl/⌘ + Enter)">▶ Render</button>
  </div>
</header>

<main>
  <!-- Left Pane: Editor -->
  <div class="pane">
    <div class="card">
      <div class="card-header">
        <span>Artwork Script</span>
        <span id="renderSummary">One scene per blank-line block · stick figures + painted background</span>
      </div>
      <textarea id="src" spellcheck="false"></textarea>
    </div>
  </div>

  <!-- Right Pane: Displays -->
  <div class="pane">
    <!-- Tab 1: Storyboard -->
    <div id="viewStoryboard" class="active">
      <div class="storyboard-grid" id="boardGrid">
        <div class="empty-state">Your rendered scenes will appear here.</div>
      </div>
    </div>

    <!-- Tab 2: Live Viewer -->
    <div id="viewViewer">
      <div class="viewer-controls workspace-tools"><button class="action compact" id="zoomOut">−</button><input id="zoomRange" type="range" min="1" max="12" value="2" style="width:120px"><button class="action compact" id="zoomIn">+</button><span id="zoomLabel" class="tool-note">2×</span><button class="action compact" id="btnPng" title="Save selected scene as PNG">PNG</button><button class="action compact" id="btnCopy" title="Copy script to clipboard">Copy code</button><span id="pixelInfo" class="tool-note">Hover image to inspect pixel color</span></div><div class="viewer-controls">
        <select id="sceneSelect" class="action" style="padding: 8px;"></select>
        <button class="action primary" id="btnPlay">▶ Play Scene</button>
      </div>
      <div class="viewer-canvas-wrapper">
        <canvas id="liveCanvas" width="256" height="256"></canvas>
      </div>
    </div>
  </div>
</main>

function line(t){const a=flat(opts(sp(t)));const[x1,y1,x2,y2]=[1,2,3,4].map(i=>ev(a[i]));const c=col(a[5]);let w=1,w2=null;

for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)ins=!ins}if(ins)sput(x,y,c)}}

/* ---- stickman layer ---------------------------------------------------
   A figure is 9 pose numbers + position. Poses 1..12 are canonical keys;
   stickanim blends two of them. Everything is drawn with the same
   capsules as the rest of the engine, with coverage AA on the edges.   */
const SPOSE={
 1:[0.04,0.09,-0.09,0.10,0.10,0.11,-0.06,0.22,0.30],
 2:[0.14,0.40,-0.38,0.15,0.15,-0.40,0.40,0.55,0.55],
 3:[0.14,0.10,-0.10,0.30,0.30,-0.10,0.10,0.45,0.45],
 4:[0.38,0.80,-0.55,0.85,0.30,-0.95,0.85,1.45,1.45],
 5:[0.38,0.20,-0.10,1.10,0.55,-0.40,0.40,1.55,1.55],
 6:[0.10,0.70,-0.25,1.70,1.50,2.50,-2.40,0.30,0.30],
 7:[0.05,0.12,-0.12,0.12,0.12,2.35,0.15,0.35,0.30],
 8:[0.10,0.15,-0.15,0.12,0.12,1.45,-0.10,0.10,0.25],
 9:[0.15,0.95,-0.95,1.45,1.45,-0.35,0.35,0.55,0.55],
 10:[0.12,0.40,-0.40,0.45,0.45,0.95,-0.55,1.70,1.35],
 11:[-0.55,0.55,-0.35,0.40,0.25,1.20,-1.10,0.60,0.55],
 12:[0.10,0.25,-0.25,0.20,0.20,-0.55,-0.45,1.30,1.30]
};
function stStroke(x1,y1,x2,y2,r1,r2,c,a){
  const R=Math.max(r1,r2)+1;
  const xa=Math.max(0,Math.floor(Math.min(x1,x2)-R)), xb=Math.min(W,Math.ceil(Math.max(x1,x2)+R));
  const ya=Math.max(0,Math.floor(Math.min(y1,y2)-R)), yb=Math.min(H,Math.ceil(Math.max(y1,y2)+R));
  for(let yy=ya;yy<yb;yy++)for(let xx=xa;xx<xb;xx++){
    const d=F.cap(xx,yy,x1,y1,x2,y2,r1,r2);
    if(d<0.9){const v=Math.max(0,Math.min(1,0.6-d))*a; if(v>0.002)put(xx,yy,c,v,'replace')}

}
function stDraw(x,y,s,P,c,flip,a){
  const lean=P[0],t1=P[1],t2=P[2],b1=P[3],b2=P[4],s1=P[5],s2=P[6],e1=P[7],e2=P[8];
  const HDR=16*s, TL=33*s, SL=34*s, UA=21*s, FA=20*s, TR=32*s, HD=17*s;
  const hx=x, hy=y;
  const cx=x+Math.sin(lean)*TR, cy=y-Math.cos(lean)*TR;
  const hdx=cx+Math.sin(lean)*HD, hdy=cy-Math.cos(lean)*HD;
  const sx=cx, sy=cy+3*s;
  const k1x=hx+Math.sin(t1)*TL, k1y=hy+Math.cos(t1)*TL;
  const f1x=k1x+Math.sin(t1-b1)*SL, f1y=k1y+Math.cos(t1-b1)*SL;
  const k2x=hx+Math.sin(t2)*TL, k2y=hy+Math.cos(t2)*TL;
  const f2x=k2x+Math.sin(t2-b2)*SL, f2y=k2y+Math.cos(t2-b2)*SL;
  const e1x=sx+Math.sin(s1)*UA, e1y=sy+Math.cos(s1)*UA;
  const w1x=e1x+Math.sin(s1+e1)*FA, w1y=e1y+Math.cos(s1+e1)*FA;
  const e2x=sx+Math.sin(s2)*UA, e2y=sy+Math.cos(s2)*UA;
  const w2x=e2x+Math.sin(s2+e2)*FA, w2y=e2y+Math.cos(s2+e2)*FA;
  const segs=[
    [hx,hy,k2x,k2y,3.2*s,3.0*s],
    [k2x,k2y,f2x,f2y,3.0*s,2.6*s],
    [sx,sy,e2x,e2y,3.0*s,2.7*s],
    [e2x,e2y,w2x,w2y,2.7*s,2.5*s],
    [hx,hy,cx,cy,3.8*s,3.5*s],
    [sx,sy,e1x,e1y,3.0*s,2.7*s],
    [e1x,e1y,w1x,w1y,2.7*s,2.5*s],
    [hx,hy,k1x,k1y,3.2*s,3.0*s],
    [k1x,k1y,f1x,f1y,3.0*s,2.6*s]
  ];

  for(const g of segs)stStroke(g[0],g[1],g[2],g[3],g[4],g[5],c,a);

}
function stick(t){
  const a=flat(opts(sp(t)));
  const x=ev(a[1]),y=ev(a[2]),s=ev(a[3]),pi=Math.round(ev(a[4]));
  const c=col(a[5]);
  let fl=false;
  for(const o of a.slice(6))if(/^flip$/i.test(o))fl=true;
  stDraw(x,y,s,SPOSE[pi]||SPOSE[1],c,fl,SO.a);
}
function stickanim(t){
  const a=flat(opts(sp(t)));
  const x=ev(a[1]),y=ev(a[2]),s=ev(a[3]),p1=Math.round(ev(a[4])),p2=Math.round(ev(a[5]));

function parse(L,i,top){const N=[];while(i<L.length){const[ln,raw]=L[i],t=raw.trim();if(!t){i++;continue}const k=t.split(/\s/)[0].toLowerCase();
if(k==='end'){if(top){i++;continue}return[N,i+1]}

function exec(N){for(const[ln,t,ch]of N){try{cmd(t,ch);NC++}catch(e){if(e===RET)throw e;const m='ERR line '+ln+': '+e.message;if(ERR.length<40&&!ERR.includes(m))ERR.push(m)}}}
function cmd(t,ch){const k=t.split(/\s/)[0].toLowerCase();
if(k==='size'){const a=sp(t);if(a.length>=3)setSize(ev(a[1]),ev(a[2]));return}
if(k==='clip')return;
if(k==='seed'){SEED=Math.floor(ev(t.slice(4)));rs=SEED}
else if(k==='let'){const m=t.match(/^let\s+(\w+)\s*=\s*(.+)$/i);if(!m)throw Error('bad let');V[m[1]]=ev(m[2])}
else if(k==='for'){const m=t.match(/^for\s+(\w+)\s+in\s+(\S+?)\.\.(\S+)(?:\s+step\s+(\S+))?$/i);if(!m)throw Error('bad for');

else if(k==='if'){if(ev(t.slice(2)))exec(ch)}
else if(k==='def'){const a=t.split(/\s+/);DEF[a[1].toLowerCase()]=[a.slice(2),ch]}
else if(k==='return')throw RET;
else if(k==='paint')paint(t);
else if(k==='plot'){const a=flat(opts(sp(t))),c=col(a[3]);let r=0;for(const o of a.slice(4))if(/^r=/i.test(o))r=ev(o.slice(2));disc(Math.round(ev(a[1])),Math.round(ev(a[2])),r,c)}
else if(k==='line')line(t);
else if(k==='poly')poly(t);
else if(k==='rows'){const a=sp(t);drawRows(ch,ev(a[1]),ev(a[2]),a.slice(3))}
else if(k==='sprite'){SPR[t.split(/\s+/)[1]]=ch}
else if(k==='stamp'){const a=sp(t),r=SPR[a[1]];if(!r)throw Error('unknown sprite "'+a[1]+'"');drawRows(r,ev(a[2]),ev(a[3]),a.slice(4))}
else if(k==='stick')stick(t);
else if(k==='stickanim')stickanim(t);
else if(k==='fn'){const m=t.match(/^fn\s+(\w+)\s*\(([^)]*)\)\s*=\s*(.+)$/i);if(!m)throw Error('bad fn');FN[m[1]]=[m[2].split(',').map(s=>s.trim()).filter(Boolean),compile(m[3])]}
else if(DEF[k]){const[ps,body]=DEF[k];if(DEPTH>=16)throw Error('recursion depth limit');const args=sp(t.slice(k.length).trim()).map(ev);
const old=V;V=Object.assign({},old);ps.forEach((p,i)=>V[p]=args[i]);DEPTH++;try{exec(body)}catch(e){if(e!==RET)throw e}finally{DEPTH--;V=old}}
else throw Error('unknown command "'+k+'"')}

function run(srcText){
  if(!/^\s*SIZE\s+\S+\s+\S+\s*$/im.test(srcText))setSize(128,128);
  img.fill(0);P={};V={pi:Math.PI,W,H};DEF={};FN={};SPR={};ERR=[];NC=0;SEED=1;rs=1;DEPTH=0;
  DL=performance.now()+Math.min(15000,Math.max(2500,2500*W*H/16384));
  const L=srcText.split('\n').map((l,i)=>[i+1,/^\s*```/.test(l)?'':l.replace(/(^|\s)#(?![0-9a-fA-F]{6}\b).*$/,'').replace(/\s+$/,'')]);
  try{exec(parse(L,0,true)[0])}catch(e){if(e!==RET)ERR.push('ERR '+e.message)}

}

    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 256;
    
    const footer = document.createElement('div');
    footer.className = 'scene-footer';
    footer.innerHTML = `<span class="status-text">Rendering...</span><span class="meta-text"></span>`;
    
    canvasContainer.appendChild(canvas);
    card.appendChild(header);
    card.appendChild(canvasContainer);
    card.appendChild(footer);
    board.appendChild(card);
    
    // Render asynchronously to not block UI
    setTimeout(() => {
      if (currentRender !== renderGeneration) return;
      try {
        const result = run(sceneCode);
        canvas.width = result.W;
        canvas.height = result.H;
        const ctx = canvas.getContext('2d');
        const id = ctx.createImageData(result.W, result.H);
        
        for (let i = 0; i < result.W * result.H; i++) {
          id.data.set([result.img[i*3], result.img[i*3+1], result.img[i*3+2], 255], i * 4);
        }
        ctx.putImageData(id, 0, 0);
        
        const status = footer.querySelector('.status-text');
        const meta = footer.querySelector('.meta-text');
        
        if (result.ERR.length > 0) {
          status.innerHTML = `<span class="status-err">${result.ERR.length} errors</span>`;
          meta.textContent = result.ERR[0].substring(0, 30) + '...';
        } else {
          status.innerHTML = `<span class="status-ok">Success</span>`;
          meta.textContent = `${result.W}x${result.H}`;
        }
        
        // Store for export
        cachedScenes[index] = { title, canvas: canvas.toDataURL('image/png') };
        completed++;
        
        if (completed + failed === scenes.length) finishRender();
      } catch (e) {
        failed++;
        footer.querySelector('.status-text').innerHTML = `<span class="status-err">Failed</span>`;
        footer.querySelector('.meta-text').textContent = e.message || String(e);
        if (completed + failed === scenes.length) finishRender();
      }
    }, 10 * index);
  });
}

// Live Viewer logic
sceneSelect.addEventListener('change', (e) => {
  const idx = parseInt(e.target.value);
  const sceneCode = src.value.split(/\n\s*\n/).filter(s => s.trim().length > 0 && s.includes('SIZE'))[idx];
  if(!sceneCode) return;

  const result = run(sceneCode);
  liveCanvas.width = result.W;
  liveCanvas.height = result.H;
  const ctx = liveCanvas.getContext('2d');
  const id = ctx.createImageData(result.W, result.H);
  for (let i = 0; i < result.W * result.H; i++) {
    id.data.set([result.img[i*3], result.img[i*3+1], result.img[i*3+2], 255], i * 4);
  }
  ctx.putImageData(id, 0, 0);
});

btnPlay.addEventListener('click', () => {
  sceneSelect.dispatchEvent(new Event('change'));
});

// Export Logic
btnZip.addEventListener('click', async () => {
  if (!cachedScenes.some(Boolean)) return;
  btnZip.textContent = '⏳ Zipping...';
  
  const zip = new JSZip();
  for (let i = 0; i < cachedScenes.length; i++) {
    const scene = cachedScenes[i];
    if (!scene) continue;
    const base64Data = scene.canvas.split(',')[1];
    const safeName = scene.title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
    zip.file(`scene_${i+1}_${safeName}.png`, base64Data, {base64: true});
  }
  
  const content = await zip.generateAsync({type: "blob"});
  const url = URL.createObjectURL(content);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pixel_brush_storyboard.zip';
  a.click();
  URL.revokeObjectURL(url);
  
  btnZip.textContent = '📦 Download ZIP';
});

btnSheet.addEventListener('click', () => {
  if (!cachedScenes.some(Boolean)) return;
  
  // Create a massive canvas to stitch them together (max 3 per row)
  const cols = 3;
  const validScenes = cachedScenes.filter(Boolean);
  const rows = Math.ceil(validScenes.length / cols);
  const cellW = 256;
  const cellH = 256;
  const padding = 20;
  
  const sheet = document.createElement('canvas');
  sheet.width = cols * cellW + (cols + 1) * padding;
  sheet.height = rows * cellH + (rows + 1) * padding;
  const ctx = sheet.getContext('2d');
  
  // Fill background
  ctx.fillStyle = '#181a20';
  ctx.fillRect(0, 0, sheet.width, sheet.height);
  
  let loaded = 0;
  validScenes.forEach((scene, i) => {
    const img = new Image();
    img.onload = () => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = padding + col * (cellW + padding);
      const y = padding + row * (cellH + padding);
      ctx.drawImage(img, x, y, cellW, cellH);
      
      loaded++;
      if (loaded === validScenes.length) {
        const url = sheet.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = url;
        a.download = 'storyboard_sheet.png';
        a.click();
      }
    };
    img.src = scene.canvas;
  });
});

btnRender.addEventListener('click', renderAll);

// Auto render on load
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(renderAll, 100);
});
</script>
<script>
(function(){
const key='pixel-brush-studio-script-v2',range=document.getElementById('zoomRange'),label=document.getElementById('zoomLabel'),info=document.getElementById('pixelInfo');
function zoom(){const z=Number(range.value)||1;label.textContent=z+'×';liveCanvas.style.width=(liveCanvas.width*z)+'px';liveCanvas.style.height=(liveCanvas.height*z)+'px'}range.addEventListener('input',zoom);document.getElementById('zoomOut').onclick=()=>{range.value=Math.max(1,+range.value-1);zoom()};document.getElementById('zoomIn').onclick=()=>{range.value=Math.min(12,+range.value+1);zoom()};
liveCanvas.addEventListener('mousemove',e=>{const r=liveCanvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*liveCanvas.width/r.width),y=Math.floor((e.clientY-r.top)*liveCanvas.height/r.height);if(x<0||y<0||x>=liveCanvas.width||y>=liveCanvas.height)return;const d=liveCanvas.getContext('2d').getImageData(x,y,1,1).data;info.textContent='x:'+x+' y:'+y+' · #'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase()});liveCanvas.addEventListener('mouseleave',()=>info.textContent='Hover image to inspect pixel color');
document.getElementById('btnPng').onclick=()=>{const a=document.createElement('a');a.href=liveCanvas.toDataURL('image/png');a.download='pixel-brush-scene.png';a.click()};document.getElementById('btnCopy').onclick=async()=>{try{await navigator.clipboard.writeText(src.value);info.textContent='Script copied'}catch(e){info.textContent='Clipboard access denied'}};
document.getElementById('btnSourceDownload').onclick=()=>{const u=URL.createObjectURL(new Blob([src.value],{type:'text/plain'})),a=document.createElement('a');a.href=u;a.download='pixel-brush-script.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
document.getElementById('btnSourceLoad').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.txt,.pb,.pixelbrush';i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{src.value=String(rd.result||'');try{localStorage.setItem(key,src.value)}catch(e){}renderAll()};rd.readAsText(f)};i.click()};
let timer,liveRenderTimer;
src.addEventListener('input',()=>{
  clearTimeout(timer);timer=setTimeout(()=>{try{localStorage.setItem(key,src.value)}catch(e){}},350);
  clearTimeout(liveRenderTimer);liveRenderTimer=setTimeout(()=>renderAll(),700);
});try{const saved=localStorage.getItem(key);if(saved&&saved!==src.value&&confirm('Restore your previous Pixel Brush script?'))src.value=saved}catch(e){}document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();renderAll()}});sceneSelect.addEventListener('change',()=>setTimeout(zoom,30));setTimeout(zoom,120);
})();
</script></body>
