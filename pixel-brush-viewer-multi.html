<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Brush Viewer</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--fg:#14171f;--mut:#667085;--line:#d5d9e0;--ok:#127a3d;--bad:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e14;--panel:#141923;--fg:#e6e9f0;--mut:#8b94a7;--line:#262d3b;--ok:#4ade80;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#0b0e14;--panel:#141923;--fg:#e6e9f0;--mut:#8b94a7;--line:#262d3b;--ok:#4ade80;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h1{font-size:16px;margin:0}header span{color:var(--mut);font-size:12px}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;padding:14px 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
textarea{width:100%;height:62vh;min-height:320px;resize:vertical;background:transparent;color:var(--fg);border:0;outline:0;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto}
canvas{display:block;width:100%;height:auto;max-width:100%;margin:0 auto;image-rendering:pixelated;border-radius:6px;background:#000}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 6px}
button{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:5px 11px;font:inherit;cursor:pointer}
select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font:inherit;cursor:pointer}
.pick{color:var(--mut);font-size:12px;display:flex;gap:6px;align-items:center;margin-left:auto}
#st{font-weight:600}.ok{color:var(--ok)}.bad{color:var(--bad)}
pre{margin:0;font:11px/1.25 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-x:auto;color:var(--mut);max-height:300px;overflow-y:auto}
</style></head><body>
<header><h1>Pixel Brush Viewer</h1><span>paste an agent’s command block, it renders live · SIZE w h sets the canvas · bad lines are skipped, never fatal</span></header>
<main>
<div class="card"><textarea id="src" spellcheck="false"></textarea></div>
<div class="card"><canvas id="cv" width="128" height="128"></canvas>
<div class="bar"><span id="st"></span><button id="cp">Copy report for agent</button>
<label class="pick">canvas
<select id="sz">
<option>128</option><option>256</option><option>512</option><option>720</option><option>768</option><option>1280</option>
</select></label></div>
<pre id="rep"></pre></div>
</main>
<script type="text/plain" id="demo"># ═══ LIGHTHOUSE IN A BREAKING STORM ═══
# Plan: lone lighthouse on a right-hand headland, storm clouds torn open at upper left
# so the moon leaks through. Cold moon light from upper-left, warm lamp = focal point.
# Layers: sky > stars > moon > clouds > beam > sea > reflection > headland > tower
#         > birds > foam > foreground crag > lamp glow > vignette
SIZE 128 128
seed 7
PALETTE
  void #060913  deep #0E1736  dusk #1F3563  haze #41659B
  moon #EAF2FF  moonglow #22305A  cloud0 #1B2748  cloud1 #2F4474  cloud2 #6F8BBE
  sea0 #08162E  sea1 #123A66  sea2 #2A6A93  foam #D2E9F4
  rock0 #07080E  rock1 #141827  rock2 #262C43  rock3 #424B6B
  lamp #FFEDB0  warm #FFB347  beamc #8C5F20  glow #5A3A12  wall #DAD5C8  red #B5303A

# ---- sky: one banded dither ramp, then stars ----
paint in 0 0 128 80 with ramp(y/80,void,deep,dusk,haze) dither
for i in 0..90
  let sx = rand(0,128)
  let sy = rand(0,50)
  plot sx sy shade(moon,rand(-0.8,-0.2))
end
for i in 0..9
  plot rand(0,128) rand(0,40) moon
end

# ---- moon: lit sphere, craters, wide cold halo ----
paint where dist(x,y,30,23)<9 with mix(moon,#8FA6D0,dist(x,y,27,20)/15) dither
paint where dist(x,y,34,21)<1.8 with #B3C4E4
paint where dist(x,y,26,27)<2.4 with #B3C4E4
paint where dist(x,y,30,23)<36 with moonglow a=(1-dist(x,y,30,23)/36)^1.5*0.9 blend=add dither

# ---- storm clouds, torn open around the moon ----
paint in 0 0 128 78 where fbm(x*0.03,y*0.08+4,4) > 0.41+abs(y-40)/50*0.3+smooth(34,9,dist(x,y,30,23))*0.4 with ramp(clamp((fbm(x*0.03+7,y*0.08,3)-0.35)*2.2+smooth(70,0,dist(x,y,30,23))*0.6,0,1),cloud0,cloud1,cloud2) dither

# ---- lamp beam sweeping left through the clouds ----
paint where x<94 and abs(y-(28+(96-x)*0.13))<1.2+(96-x)*0.12 with beamc a=(1-(96-x)/120)*0.85 blend=add dither

# ---- sea: depth ramp, horizon haze, wave crests, moon glitter ----
paint in 0 78 128 50 with ramp((y-78)/50,sea2,sea1,sea0) dither
paint in 0 72 128 12 with haze a=(1-abs(y-78)/6)*0.5 dither
paint in 0 79 128 49 where sin(y*(1.3+(y-78)*0.02)+noise(x*0.06,y*0.25)*10)>0.86-(y-78)*0.002 with mix(sea2,foam,0.25+(y-78)/150)
paint in 0 80 128 48 where abs(x-30+(noise(x*0.15,y*0.4)-0.5)*14)<3+(y-80)*0.05 and sin(y*1.9+noise(x*0.1,y*0.3)*6)>-0.1 with moon a=0.75 dither

# ---- headland: lit crest fading to black, noisy surface, cracks ----
paint where y>128-58*smooth(30,92,x)+noise(x*0.12,3)*5 with ramp(clamp((y-(128-58*smooth(30,92,x)))/30+(fbm(x*0.1,y*0.1,3)-0.5)*0.8,0,1),rock3,rock2,rock1,rock0) dither
paint where y>128-58*smooth(30,92,x)+noise(x*0.12,3)*5+3 and noise(x*0.35,y*0.6+9)>0.7 with rock0 a=0.8 dither
paint where y>128-58*smooth(30,92,x)+noise(x*0.12,3)*5+2 and fbm(x*0.25,y*0.3+3,3)>0.6 with rock3 a=0.5 dither

# ---- tower: tapered body, lit left / dark right, red bands ----
paint where abs(x-96)<3.8+(y-36)*0.085 and y>=36 and y<76 with shade(wall,(94-x)/6*0.5)
paint where abs(x-96)<3.8+(y-36)*0.085 and y>=36 and y<76 and floor((y-36)/9)%2==1 with shade(red,(94-x)/6*0.45)
paint in 95 49 3 4 with lamp
paint in 93 69 6 7 with rock1
paint in 90 33 13 2 with rock1
paint in 90 30 13 1 with rock2
paint in 90 31 13 2 where x%2==0 with rock2
paint in 92 24 9 7 with lamp
paint in 95 26 3 4 with shade(lamp,0.8)
paint in 92 24 1 7 with rock1
paint in 100 24 1 7 with rock1
paint in 96 24 1 7 with rock1
poly 90,24 96,15 102,24 rock1
line 90 24 96 15 rock3
line 96 12 96 15 rock2

# ---- birds crossing the beam (a def of my own, just two strokes) ----
def bird x y s
  line x-s y-s*0.6 x y rock0
  line x y x+s y-s*0.6 rock0
end
bird 70 31 3
bird 62 37 2
bird 77 26 2
bird 55 34 2

# ---- surf along the waterline + spray plumes ----
for fx in 34..92
  let ty = 128-58*smooth(30,92,fx)+noise(fx*0.12,3)*5
  if rand()<0.75
    plot fx ty+rand(-1,2) foam
  end
  if rand()<0.3
    plot fx-rand(1,4) ty+rand(0,3) shade(foam,-0.4)
  end
end
for i in 0..8
  let sx = rand(40,84)
  let sy = 128-58*smooth(30,92,sx)+noise(sx*0.12,3)*5
  line sx sy sx-rand(0,3) sy-rand(2,5) foam w=2 w2=0
end

# ---- foreground crag, bottom-left, moon-rimmed ----
paint where y>102+noise(x*0.09,11)*9+smooth(0,38,x)*26 with ramp((y-100)/22+(fbm(x*0.2,y*0.2,2)-0.5)*0.6,rock3,rock1,rock0) dither

# ---- lamp glow: warm light bleeding onto cloud, tower and rock ----
paint where dist(x,y,96,28)<32 with glow a=(1-dist(x,y,96,28)/32)^2 blend=add dither
paint where dist(x,y,96,28)<9 with #7A5A20 a=(1-dist(x,y,96,28)/9) blend=add dither

# ---- vignette ----
paint where dist(x,y,64,60)>46 with void a=((dist(x,y,64,60)-46)/60)*0.8 dither
</script>

dist:(a,b,c,d)=>Math.hypot(a-c,b-d),

box:(px,py,cx,cy,hw,hh)=>{const qx=Math.abs(px-cx)-hw,qy=Math.abs(py-cy)-hh;return Math.hypot(Math.max(qx,0),Math.max(qy,0))+Math.min(Math.max(qx,qy),0)},
smin:(a,b,k)=>{const h=Math.max(k-Math.abs(a-b),0)/k;return Math.min(a,b)-h*h*k*.25}};
const hx=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16));
const TR=/\s*(#[0-9a-fA-F]{6}\b|(?:\d+\.?\d*|\.\d+)|[A-Za-z_]\w*|<=|>=|==|!=|[-+*\/%^<>(),])/y;
const CMP={'<':(a,b)=>a<b,'>':(a,b)=>a>b,'<=':(a,b)=>a<=b,'>=':(a,b)=>a>=b,'==':(a,b)=>a==b,'!=':(a,b)=>a!=b};

while(i<src.length){TR.lastIndex=i;m=TR.exec(src);if(!m){if(/^\s*$/.test(src.slice(i)))break;throw Error('bad token near "'+src.slice(i,i+8)+'"')}t.push(m[1]);i=TR.lastIndex}
let p=0;const pk=()=>t[p],nx=()=>t[p++];
const or=()=>{let a=an();while(pk()==='or'){nx();const l=a,r=an();a=()=>l()||r()}return a};
const an=()=>{let a=nt();while(pk()==='and'){nx();const l=a,r=nt();a=()=>l()&&r()}return a};
const nt=()=>{if(pk()==='not'){nx();const e=nt();return()=>!e()}return cm()};
const cm=()=>{let a=ad();while(CMP[pk()]){const f=CMP[nx()],l=a,r=ad();a=()=>f(l(),r())}return a};
const ad=()=>{let a=mu();while(pk()==='+'||pk()==='-'){const o=nx(),l=a,r=mu();a=o==='+'?()=>l()+r():()=>l()-r()}return a};
const mu=()=>{let a=un();while(pk()==='*'||pk()==='/'||pk()==='%'){const o=nx(),l=a,r=un();a=o==='*'?()=>l()*r():o==='/'?()=>l()/r():()=>l()%r()}return a};
const un=()=>{if(pk()==='-'){nx();const e=un();return()=>-e()}return pw()};
const pw=()=>{const l=pr();if(pk()==='^'){nx();const r=un();return()=>Math.pow(l(),r())}return l};
const pr=()=>{const k=nx();if(k===undefined)throw Error('unexpected end');
if(k==='('){const e=or();if(nx()!==')')throw Error('missing )');return e}

throw Error('unexpected "'+k+'"')};
const e=or();if(p<t.length)throw Error('unexpected "'+t[p]+'"');CACHE.set(src,e);return e}
const ev=s=>compile(s)();
function col(s){D=false;V.x=V.y=0;const c=ev(s);if(!Array.isArray(c))throw Error('color expected: '+s);return c}

function paint(t){const m=t.match(/^paint(?:\s+in\s+(\S+)\s+(\S+)\s+(\S+)\s+(\S+))?(?:\s+where\s+(.+?))?\s+with\s+(.+)$/i);if(!m)throw Error('bad paint syntax');

for(const o of opt){if(/^flip$/i.test(o)){fl=true;continue}const q=o.indexOf('=');if(q<0)continue;const n=o.slice(0,q),v=o.slice(q+1);

R.forEach((r,dy)=>[...r].forEach((c,dx)=>{if(mp[c]){const X=fl?w-1-dx:dx;cells.push([X,dy,mp[c]]);occ.add(X+','+dy)}}));

if(ol){const ed=new Set();for(const[cx,cy]of cells)for(const[ox,oy]of[[1,0],[-1,0],[0,1],[0,-1]]){const k=(cx+ox)+','+(cy+oy);if(!occ.has(k)&&!ed.has(k)){ed.add(k);blk(cx+ox,cy+oy,ol)}}}

function parse(L,i,top){const N=[];while(i<L.length){const[ln,raw]=L[i],t=raw.trim();if(!t){i++;continue}const k=t.split(/\s/)[0].toLowerCase();
if(k==='end'){if(top){i++;continue}return[N,i+1]}
if(k==='palette'){i++;while(i<L.length&&/^\s/.test(L[i][1])&&L[i][1].trim()){const tk=L[i][1].trim().split(/\s+/);
for(let j=0;j+1<tk.length;j+=2){if(/^#[0-9a-fA-F]{6}$/.test(tk[j+1]))P[tk[j]]=hx(tk[j+1]);else ERR.push('ERR line '+L[i][0]+': bad palette entry '+tk[j])}i++}continue}
if(k==='for'||k==='if'||k==='def'){const r=parse(L,i+1,false);N.push([ln,t,r[0]]);i=r[1];continue}
if(k==='rows'||k==='sprite'){const b=[];i++;while(i<L.length&&L[i][1].trim().toLowerCase()!=='end'){b.push(L[i][1].trim());i++}i++;N.push([ln,t,b]);continue}
N.push([ln,t,null]);i++}return[N,i]}
function exec(N){for(const[ln,t,ch]of N){try{cmd(t,ch);NC++}catch(e){if(e===RET)throw e;const m='ERR line '+ln+': '+e.message;if(ERR.length<40&&!ERR.includes(m))ERR.push(m)}}}
function cmd(t,ch){const k=t.split(/\s/)[0].toLowerCase();
if(k==='size'){const a=sp(t);if(a.length>=3)setSize(ev(a[1]),ev(a[2]));return}
if(k==='clip')return;
if(k==='seed'){SEED=Math.floor(ev(t.slice(4)));rs=SEED}
else if(k==='let'){const m=t.match(/^let\s+(\w+)\s*=\s*(.+)$/i);if(!m)throw Error('bad let');V[m[1]]=ev(m[2])}
else if(k==='for'){const m=t.match(/^for\s+(\w+)\s+in\s+(\S+?)\.\.(\S+)(?:\s+step\s+(\S+))?$/i);if(!m)throw Error('bad for');
const a=ev(m[2]),b=ev(m[3]),st=m[4]?ev(m[4]):1;if(!(st>0))throw Error('step must be > 0');
for(let i=a,n=0;i<=b&&n<1e5;i+=st,n++){if(performance.now()>DL)throw Error('time limit hit');V[m[1]]=i;exec(ch)}}
else if(k==='if'){if(ev(t.slice(2)))exec(ch)}
else if(k==='def'){const a=t.split(/\s+/);DEF[a[1].toLowerCase()]=[a.slice(2),ch]}
else if(k==='return')throw RET;
else if(k==='paint')paint(t);
else if(k==='plot'){const a=flat(opts(sp(t))),c=col(a[3]);let r=0;for(const o of a.slice(4))if(/^r=/i.test(o))r=ev(o.slice(2));disc(Math.round(ev(a[1])),Math.round(ev(a[2])),r,c)}
else if(k==='line')line(t);
else if(k==='poly')poly(t);
else if(k==='rows'){const a=sp(t);drawRows(ch,ev(a[1]),ev(a[2]),a.slice(3))}
else if(k==='sprite'){SPR[t.split(/\s+/)[1]]=ch}
else if(k==='stamp'){const a=sp(t),r=SPR[a[1]];if(!r)throw Error('unknown sprite "'+a[1]+'"');drawRows(r,ev(a[2]),ev(a[3]),a.slice(4))}
else if(k==='fn'){const m=t.match(/^fn\s+(\w+)\s*\(([^)]*)\)\s*=\s*(.+)$/i);if(!m)throw Error('bad fn');FN[m[1]]=[m[2].split(',').map(s=>s.trim()).filter(Boolean),compile(m[3])]}
else if(DEF[k]){const[ps,body]=DEF[k];if(DEPTH>=16)throw Error('recursion depth limit');const args=sp(t.slice(k.length).trim()).map(ev);
const old=V;V=Object.assign({},old);ps.forEach((p,i)=>V[p]=args[i]);DEPTH++;try{exec(body)}catch(e){if(e!==RET)throw e}finally{DEPTH--;V=old}}
else throw Error('unknown command "'+k+'"')}
function run(srcText){
if(!/^\s*SIZE\s+\S+\s+\S+\s*$/im.test(srcText))setSize(128,128);
img.fill(0);P={};V={pi:Math.PI,W,H};DEF={};FN={};SPR={};ERR=[];NC=0;SEED=1;rs=1;DEPTH=0;
DL=performance.now()+Math.min(15000,Math.max(2500,2500*W*H/16384));
const L=srcText.split('\n').map((l,i)=>[i+1,/^\s*```/.test(l)?'':l.replace(/(^|\s)#(?![0-9a-fA-F]{6}\b).*$/,'').replace(/\s+$/,'')]);
try{exec(parse(L,0,true)[0])}catch(e){if(e!==RET)ERR.push('ERR '+e.message)}}
let report='';
function draw(){const t0=performance.now();run(src.value);const ms=Math.round(performance.now()-t0);
cv.width=W;cv.height=H;const id=cx.createImageData(W,H);let nb=0;
for(let i=0;i<W*H;i++){const r=img[i*3],g=img[i*3+1],b=img[i*3+2];id.data.set([r,g,b,255],i*4);if(r+g+b>0)nb++}
cx.putImageData(id,0,0);const cov=Math.round(nb/(W*H)*100),ch=' .:-=+*#%@';let th='';
const stp=Math.max(1,Math.floor(Math.min(W,H)/32));
for(let y=0;y<32;y++){for(let x=0;x<32;x++){const px=Math.min(W-1,x*stp),py=Math.min(H-1,y*stp);const i=(py*W+px)*3,l=(img[i]*.3+img[i+1]*.59+img[i+2]*.11)/256;th+=ch[Math.min(9,Math.floor(l*10))]}th+='\n'}
report=(ERR.length?'ERRORS ('+ERR.length+')':'OK')+' — '+NC+' commands, '+ERR.length+' errors, coverage '+cov+'% non-black, '+ms+' ms — '+W+'x'+H+'\n'+ERR.join('\n')+(ERR.length?'\n':'')+'Thumbnail 32x32 (dark → light):\n'+th;
st.textContent=(ERR.length?ERR.length+' error'+(ERR.length>1?'s':''):'OK')+' · '+NC+' cmds · '+ms+' ms · '+W+'x'+H;st.className=ERR.length?'bad':'ok';rep.textContent=report;
const mm=src.value.match(/^\s*SIZE\s+(\d+)\s+(\d+)\s*$/im);if(mm&&mm[1]===mm[2]&&[...sz.options].some(o=>o.value===mm[1]))sz.value=mm[1];else if(!mm)sz.value='128'}
let tm;src.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(draw,120)});
sz.addEventListener('change',()=>{const v=sz.value,line='SIZE '+v+' '+v,s=src.value;
src.value=/^\s*SIZE\s+\S+\s+\S+\s*$/im.test(s)?s.replace(/^\s*SIZE\s+\S+\s+\S+\s*$/im,line):line+'\n'+s;draw()});
document.getElementById('cp').onclick=e=>{const b=e.target,done=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy report for agent',1200)};
const fb=()=>{const t=document.createElement('textarea');t.value=report;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(_){}t.remove();done()};
try{navigator.clipboard.writeText(report).then(done,fb)}catch(_){fb()}};
src.value=document.getElementById('demo').textContent.trim();draw();
</script></body></html>
